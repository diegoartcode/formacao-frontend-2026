<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variaveis</title>

</head>

<body>

    <script>

        var nomeSobrenome = "Diego Rodrigues"


        // String
        var nome = 'Diego'//"Diego";

        // alert(nome)

        console.log(nome);

        // Number

        var idade = 35;

        var salario = 15000.00;

        var moto = prompt('Digite um nome de moto');
        console.log(moto)

        console.log(typeof moto)

        // comentario em linha

        /* comentario de linhas
        linhas
        linhas */


        var verdadeiro = true;
        var falso = false;

        console.log(typeof verdadeiro)

        var nome1 = 'João';
        console.log(nome1)

        var nome1 = 'Maria';
        console.log(nome1)

        // let - Variáveis declaradas como let tem escopo de bloco
        // podem ser atualizada, mas não podem ser declarada novamante
        // foram criadas posteriormente ao var para evitar erros
        let nome2 = 'Romeu'
        console.log(nome2)

        nome2 = 'Julieta'


        // const - constantes (O valor não pode ser alterado)
        const variavelConts = 5;
        console.log(variavelConts)
        // variavelConts = 6;
        // console.log(variavelConts)


        // Undefined - variavel declarada, mas não atribuida a um valor
        let endereco;
        console.log(endereco);

        // Null - Ausencia intencional de valor
        let telefone = null;
        console.log(telefone);

        

        // concatenar
        let nome3 = "Diego";
        let sobrenome3 = "Rodrigues";
        let resultado = nome3 + ' ' + sobrenome3;
        console.log(resultado);
        console.log('olá ' + nome3 + ' ' + sobrenome3 + ', seja bem vindo!');

        let resultado2 = `olá ${nome3} ${sobrenome3}, seja bem vindo!`;

        console.log(resultado2);


        

    </script>
</body>

</html>
