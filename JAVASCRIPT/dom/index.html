<body>
    <h1 id="titulo">Aqui vai um texto dinamico com JS</h1>
    <p>DOM significa Document Object Model (Modelo de Objeto do documento)</p>
    <p>Quando o navegador abre uma página HTML, ele tranforma todos os elementos em uma árvore de objetos que o javascript consegue acessar</p>
